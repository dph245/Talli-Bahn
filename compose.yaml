services:
  monitor:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-8087}:8000"
    environment:
      TRANSIT_PROVIDER: ${TRANSIT_PROVIDER:-auto}
      DATABASE_PATH: /app/data/gtfs.sqlite
      GTFS_RT_URL: ${GTFS_RT_URL-https://realtime.gtfs.de/realtime-free.pb}
      GTFS_RT_TOKEN: ${GTFS_RT_TOKEN:-}
      GTFS_RT_INTERVAL_SECONDS: ${GTFS_RT_INTERVAL_SECONDS:-60}
      TRANSPORT_REST_ENABLED: ${TRANSPORT_REST_ENABLED:-true}
      DB_RIS_ENABLED: ${DB_RIS_ENABLED:-false}
      DB_CLIENT_ID: ${DB_CLIENT_ID:-}
      DB_API_KEY: ${DB_API_KEY:-}
      DB_RIS_MAPPING_PATH: ${DB_RIS_MAPPING_PATH:-data/ris-mapping.json}
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
